<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexRecordPortal</title>
    <link rel="stylesheet" href="../Employeecss/empadd.css">
    <link rel="icon" type="image/svg+xml" href="../logo/icon.svg" >
</head>
<body>
    <div class="cont">
        <h1>Add Employee</h1>
        <form id="empform">
            <label >Employee ID :</label>
            <input type="text" id="empid" placeholder="Employee ID">
            <label >Employee Name :</label>
            <input type="text" id="empname" placeholder="Employee Name">
            <label >Department :</label>
            <input type="text" id="dep" placeholder="Department">
            <label >Position :</label>
            <input type="text" id="pos" placeholder="Position">
             <button type="submit"onclick="window.location='employee.html'">Add Employee</button>
            
        </form>
        <p id="mes"></p>
    </div>
    <script src="../Employeejs/empadd.js"></script>   
</body>
</html>
