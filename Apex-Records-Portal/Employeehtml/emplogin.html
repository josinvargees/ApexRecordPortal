<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexRecordPortal</title>
    <link rel="stylesheet" href="../Employeecss/emplogin.css">
    <link rel="icon" type="image/svg+xml" href="../logo/icon.svg" >
</head>
<body>
<article class="logina">
    <div class="logind">
        <div class="logo">
            <img src="../logo/logo.jpg" alt="Apexlogo">
        </div>
        <h2>APEX RECORDS PORTAL</h2>

        <form id="loginForm">
            <div class="inputd">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter Username" required>
            </div>

            <div class="inputd">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>

            <div class="showp">
                <input type="checkbox" id="showPassword">
                <label for="showPassword">Show Password</label>
            </div>

            <button type="submit" class="loginb">Login</button>
        </form>

        <p id="message"></p>
    </div>
</div>

<script src="../Employeejs/emplogin.js"></script>
</body>
</html>
